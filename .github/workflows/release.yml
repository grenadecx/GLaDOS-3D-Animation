name: Release

on:
  push:
    branches: [main]
    # Every run tags and publishes, so skip the paths that cannot change the
    # published zip — otherwise a README tweak ships a release identical to the
    # one before it. A push touching any other path still releases as normal.
    paths-ignore:
      - '**/*.md'
      - 'demo/**'
      - 'test/**'
      - 'scripts/capture-demo.mjs'
      - '.github/**'
      - '.gitignore'
  # Escape hatch: release by hand when one of the above is the whole reason.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # Stamps manifest.json and const.py before the build, so the ?v= on the
      # served URLs matches the release HACS is installing.
      - run: node scripts/sync-version.mjs ${{ steps.gitversion.outputs.majorMinorPatch }}

      - run: npm run build

      # HACS installs an integration by extracting this straight into
      # custom_components/glados_3d/, so the contents sit at the zip root.
      - name: Package the integration
        run: |
          cd custom_components/glados_3d
          zip -r "${GITHUB_WORKSPACE}/glados_3d.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Auto-create version tag
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL="v${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "Calculated version: ${FULL}"

          # Only push if this tag doesn't already exist
          if git rev-parse "${FULL}" >/dev/null 2>&1; then
            echo "Tag ${FULL} already exists, skipping"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag "${FULL}"
            git push "origin" "${FULL}"
            echo "Created and pushed tag ${FULL}"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          files: |
            glados_3d.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
